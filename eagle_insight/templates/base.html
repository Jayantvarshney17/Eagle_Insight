<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} | Eagle Insight</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" sizes="512x512" href="\static\images\eagle.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    {% block css %}   {% endblock css %}
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
  }

  footer {
      background-image: url('/static/images/foot.jpg'); /* Background image of the footer */
      background-size: 20%; /* Cover the entire footer with the background */
      background-repeat: no-repeat;
      background-position: left;
      background-color:white;
      position: relative;
      text-align: center;
      padding: 40px 40px;
      border-radius: 20px; /* Make the footer edges rounded like a number plate */
      margin: 40px auto; /* Center the footer on the page */
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5); /* Add shadow to make it pop */
      border: 4px solid #000; /* Add a solid border to simulate a number plate */
  }

  .footer-content {
      position: relative;
      z-index: 2;
      color: black;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
  }

  .social-icons {
      margin: 20px 0;
  }

  .social-icons a {
      margin: 0 15px;
      color: black;
      text-decoration: none;
      font-size: 30px;
      transition: color 0.3s ease;
  }

  .social-icons a:hover {
      color: #007BFF; /* Change color on hover */
  }
  
  </style>
  </head>
  <body>
<nav class="navbar navbar-expand-lg navbar-dark  bg-dark">
  <img src="\static\images\1.jpg" alt="Favicon" style="width: 80px; height:60px;">
        <div class="container-fluid">
          <a class="navbar-brand" href="/home">Eagle Insight</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/home">Home</a>
              </li>
            
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/about">AboutUs</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/contact">ContactUs</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/get_status">Get Status</a>
              </li>
            </ul>
          </div>
</nav>  
{% if messages %}
{% for message in messages %}
<div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
  {{ message }}
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>  
{% endfor %}
{% endif %}
{% block body %}   {% endblock body %}     
<hr style="height:3px; border:none; color:rgb(60,90,180); background-color:rgb(60,90,180);">     
</body>
{% block footer %}{% endblock footer %}
<footer>
  <!-- Overlay for better readability -->
  <div class="footer-overlay">

  <!-- Footer content -->
  <div class="footer-content">
      <p>Connect with Us!</p>
      <div class="social-icons">
          <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
          <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
          <a href="https://www.x.com" target="_blank"><i class="fab fa-x"></i></a>
      </div>
      <p>&copy; 2024 EagleInsight. All Rights Are Reserved.</p>
      
  </div>
  </div>
  
</footer> 
<script src="https://kit.fontawesome.com/a076d05399.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js" integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V" crossorigin="anonymous"></script>
</html>
